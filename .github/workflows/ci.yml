name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run tests
        run: |
          pytest

  min-ha:
    name: Tests (Home Assistant 2026.8.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt "homeassistant==2026.8.0"

      - name: Run tests
        run: |
          pytest

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff
        run: |
          ruff check custom_components/ariston --select=E9,F63,F7,F82

      - name: Check formatting
        run: |
          ruff format --check custom_components/ariston

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test, min-ha, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Keep the same layout as the release asset: files at the root of the zip,
      # because HACS extracts it into custom_components/ariston.
      - name: Create release zip
        run: |
          git archive \
            --format=zip \
            --output="$GITHUB_WORKSPACE/ha-ariston.zip" \
            HEAD:custom_components/ariston

      - name: Verify HACS-compatible layout
        run: |
          unzip -Z1 ha-ariston.zip > /tmp/zip-contents.txt
          grep -qx 'manifest.json' /tmp/zip-contents.txt
          grep -qx '__init__.py' /tmp/zip-contents.txt
          if grep -q '^ariston/' /tmp/zip-contents.txt; then
            echo "ERROR: the zip contains an enclosing ariston/ folder" >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ha-ariston.zip
          path: ha-ariston.zip